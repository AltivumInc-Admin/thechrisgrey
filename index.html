<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tcg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <!-- IMPORTANT: keep ONLY invariant, non-per-page tags in this static shell.
         Per-page title, description, robots meta, and all og/twitter title,
         description, image, url, type, and card tags are emitted per route by
         the SEO component (react-helmet) and appear in each prerendered page's
         head. The per-page title tag and robots meta are intentionally NOT
         duplicated here: a static shell title tag produced a duplicate title
         in every prerendered page (VAL-SEO-006), and a static shell robots
         meta conflicted with the noindex meta on /chat (VAL-SEO-010). The SEO
         component emits the correct robots meta per route (index, follow, ...
         for indexable routes; noindex, nofollow for /chat, /admin, 404). -->
    <meta name="author" content="Christian Perez" />

    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#0A0F1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter — INVARIANT tags only (site_name, locale, card type,
         handle). Per-page og:title/description/image/url + twitter:title/
         description/image and og:image:width/height are emitted per route by <SEO>. -->
    <meta property="og:site_name" content="Christian Perez" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:site" content="@thechrisgrey" />

    <!-- Preconnect & DNS Prefetch for Performance.
         Only origins actually requested in the first ~10 seconds of a typical
         visit are preconnected (VAL-PERF-008). The Google Fonts Material Icons
         preconnects were removed when icons moved to inline SVG
         (VAL-PERF-006/007). Lambda Function URLs used only on form submission
         or admin auth are NOT preconnected (they are not first-10s origins). -->
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="preconnect" href="https://plausible.io" crossorigin />
    <!-- Hero intro video origin — discovered early so the MP4 request starts
         without waiting for the JS bundle to parse and create the <video>. -->
    <link rel="preconnect" href="https://d1x8296f4gso9u.cloudfront.net" crossorigin />
    <!-- YouTube thumbnails (episode cards on /podcast, embedded videos). -->
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <!-- PostHog product analytics (consent-gated; preconnecting early speeds
         up the first event after the visitor accepts the banner). The host is
         configurable via VITE_POSTHOG_HOST and defaults to us.i.posthog.com. -->
    <link rel="preconnect" href="https://us.i.posthog.com" crossorigin />
    <!-- CloudWatch RUM telemetry (errors + performance + http) runs cookieless
         on every page load when configured, hitting the us-east-1 dataplane. -->
    <link rel="preconnect" href="https://dataplane.rum.us-east-1.amazonaws.com" crossorigin />
    <!-- Cognito identity pool is used by RUM (anonymous auth) at startup when
         RUM is configured, so it is a first-10s origin in that configuration. -->
    <link rel="preconnect" href="https://cognito-idp.us-east-1.amazonaws.com" crossorigin />
    <!-- Buzzsprout hosts the podcast embeds loaded on /podcast. -->
    <link rel="preconnect" href="https://www.buzzsprout.com" crossorigin />
    <link rel="dns-prefetch" href="https://altivum.ai" />
    <link rel="dns-prefetch" href="https://vector.altivum.ai" />
    <link rel="dns-prefetch" href="https://logic.altivum.ai" />

    <!-- Preload the hero poster (the prerendered home LCP element). The poster
         is the <img> rendered in the reduced-motion / prerender path, so
         preloading it here lets the browser start the request before the JS
         bundle parses. fetchpriority=high tells the browser this is the LCP
         candidate. The asset lives in public/ so the URL is stable. -->
    <link rel="preload" as="image" href="/hero-intro-poster.webp" fetchpriority="high" />

    <!-- RSS Feed -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Christian Perez - Blog"
      href="https://thechrisgrey.com/rss.xml"
    />

    <!-- Material Icons are now inline SVGs (src/components/icons/Icon.tsx) so
         no render-blocking Google Fonts stylesheet is fetched (VAL-PERF-006). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "dce081f277f9412c9cb0d916e2d76b60"}'
    ></script>

    <!-- Plausible Analytics (privacy-friendly, no cookies) -->
    <script async src="https://plausible.io/js/pa-bQzxzh5KzDB8jWsj-fPb8.js"></script>
    <script src="/plausible-init.js"></script>
  </body>
</html>

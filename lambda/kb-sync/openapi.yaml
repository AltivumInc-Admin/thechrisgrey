openapi: 3.1.0
info:
  title: KB Sync Service
  version: '1.0.0'
  description: |
    Event-driven Lambda that syncs the Bedrock Knowledge Base when content
    changes in the `thechrisgrey-kb-source` S3 bucket. Triggered by S3 PUT/DELETE
    events, not HTTP requests. Also supports a health check invocation via
    `aws lambda invoke --payload '{"healthCheck":true}'`.

    This is not a traditional HTTP API. The OpenAPI spec documents the Lambda's
    input/output contracts for the S3 event trigger and the health check mode,
    serving as the API contract for integration testing and monitoring.
servers:
  - url: arn:aws:lambda:us-east-1:function:thechrisgrey-kb-sync
    description: Lambda ARN (invoked via S3 event or aws lambda invoke)
tags:
  - name: sync
  - name: health
paths:
  /sync:
    post:
      tags: [sync]
      operationId: syncKnowledgeBase
      summary: Trigger a Knowledge Base ingestion job from S3 events
      description: |
        Invoked automatically by S3 event notifications when objects are
        created or deleted in the `thechrisgrey-kb-source` bucket. The handler
        calls `StartIngestionJob` on the Bedrock Knowledge Base (IDs come from
        `KB_ID` / `KB_DATA_SOURCE_ID`, defaulting to `ARFYABW8HP` /
        `TXQTRAJOSD`), then polls `GetIngestionJob` until the job reaches a
        terminal state or the invocation budget runs out.

        A retryable start failure (ConflictException, ThrottlingException, 5xx)
        is re-thrown so Lambda re-invokes the async event instead of dropping
        the S3 write; terminal errors resolve with a 500 body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Records]
              properties:
                Records:
                  type: array
                  items:
                    type: object
                    properties:
                      eventName:
                        type: string
                        example: ObjectCreated:Put
                      s3:
                        type: object
                        properties:
                          bucket:
                            type: object
                            properties:
                              name:
                                type: string
                                example: thechrisgrey-kb-source
                          object:
                            type: object
                            properties:
                              key:
                                type: string
                                example: knowledge-base.txt
      responses:
        '200':
          description: |
            Ingestion job completed, or was accepted but did not settle within
            the invocation budget (`status` carries the last state observed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Knowledge Base sync triggered
                  ingestionJobId:
                    type: string
                    example: job-abc123
                  status:
                    type: [string, 'null']
                    description: Last observed ingestion job status.
                    example: COMPLETE
                  triggeredBy:
                    type: array
                    items:
                      type: object
                      properties:
                        eventName:
                          type: string
                        key:
                          type: string
                        bucket:
                          type: string
        '500':
          description: |
            The ingestion job could not be started for a terminal reason, or it
            reached a terminal state without indexing the change (FAILED,
            STOPPED, or COMPLETE with `numberOfDocumentsFailed > 0`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Failed to trigger Knowledge Base sync
                  error:
                    type: string
                  ingestionJobId:
                    type: string
                  status:
                    type: string
                    example: FAILED
  /health:
    post:
      tags: [health]
      operationId: healthCheck
      summary: Liveness probe for the kb-sync Lambda
      description: |
        Invoke with `{"healthCheck":true}` payload via `aws lambda invoke` or
        EventBridge scheduled rule. Returns service status without performing a
        KB sync or publishing metrics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [healthCheck]
              properties:
                healthCheck:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  service:
                    type: string
                    example: kb-sync
                  version:
                    type: string
                    example: '1.0.0'
                  knowledgeBaseId:
                    type: string
                    description: Resolved from `KB_ID`.
                    example: ARFYABW8HP
                  dataSourceId:
                    type: string
                    description: Resolved from `KB_DATA_SOURCE_ID` (or the legacy `DATA_SOURCE_ID`).
                    example: TXQTRAJOSD

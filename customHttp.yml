# AWS Amplify Hosting — custom HTTP response headers.
#
# WHY THIS FILE EXISTS
# Amplify Hosting applies custom headers from THIS file (customHttp.yml at the repo
# root) or the console "Custom headers" section — NOT from a `customHeaders:` block
# inside amplify.yml / the build spec, which AWS has deprecated and no longer
# applies. Headers were previously declared only in amplify.yml, so production
# served NONE of them: verified 2026-06 that thechrisgrey.com (and the Amplify
# default domain) returned no CSP/HSTS/X-Frame-Options/etc., and that even the
# cache-control rules were ignored (a hashed .js asset did not carry
# `immutable`). Moving them here is the documented fix:
# https://docs.aws.amazon.com/amplify/latest/userguide/migrate-custom-headers.html
# https://docs.aws.amazon.com/amplify/latest/userguide/custom-header-YAML-format.html
#
# REDEPLOY REQUIRED: custom headers are applied at deploy time. After merging,
# trigger an Amplify release for `main`, then verify with:
#   curl -sI https://thechrisgrey.com/ | grep -i 'content-security\|strict-transport\|x-frame'
#
# CSP ROLLOUT — ENFORCED
# The CSP previously shipped as `Content-Security-Policy-Report-Only` so
# browsers would REPORT violations to the report-uri (the metrics Lambda
# /csp-report endpoint) without blocking anything. The report window has been
# quiet, the allowlist covers every chat-widget, analytics, and video resource,
# and `script-src` carries no `unsafe-inline`/`unsafe-eval`, so it is now
# ENFORCED as `Content-Security-Policy` (VAL-SEC-001, VAL-CROSS-004). Violations
# are still routed to the metrics Lambda via `report-uri` for ongoing
# monitoring. All the other security headers below are enforced immediately.
#
# REDEPLOY REQUIRED: custom headers are applied at deploy time. After merging,
# trigger an Amplify release for `main`, then verify with:
#   curl -sI https://thechrisgrey.com/ | grep -i 'content-security\|strict-transport\|cross-origin\|permissions'

customHeaders:
  - pattern: '**/*'
    headers:
      # VAL-SEC-002 — HSTS with includeSubDomains and preload. `preload`
      # opts the site into the HSTS preload list (submit at
      # https://hstspreload.org) once the requirement of serving HTTPS on the
      # apex + all subdomains is met.
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains; preload'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      # VAL-SEC-003 — X-Frame-Options is retained as a legacy-browser fallback
      # alongside the CSP `frame-ancestors 'self'` directive.
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      # VAL-SEC-003 — Cross-origin isolation headers. COOP same-origin isolates
      # the browsing context group so a cross-origin opener cannot reference
      # `window`; CORP same-origin restricts which origins can load this
      # origin's resources cross-origin. Both are safe for a same-origin SPA
      # with allowlisted third-party CDN/frame origins in CSP.
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'Cross-Origin-Resource-Policy'
        value: 'same-origin'
      # VAL-SEC-004 — Permissions-Policy denies sensitive platform APIs the
      # site never uses. `browsing-topics` and `interest-cohort` opt out of
      # Topics-based interest cohorts; payment/usb are not used by this SPA.
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=(), interest-cohort=()'
      # VAL-SEC-001 / VAL-CROSS-004 — ENFORCED CSP.
      # style-src/font-src no longer allow fonts.googleapis.com /
      # fonts.gstatic.com: Material Icons are now inline SVGs (no icon font is
      # fetched), so the render-blocking Google Fonts stylesheet is gone
      # (VAL-PERF-006/007). 'unsafe-inline' is retained on style-src because
      # the app uses inline styles (typography.ts, GSAP/Lenis) and a nonce
      # can't be injected by static hosting; script-src has NO unsafe-inline /
      # unsafe-eval so script injection is blocked.
      # script-src DOES carry 'wasm-unsafe-eval'. That token permits WebAssembly
      # compilation ONLY -- it does not enable eval() or any JS string-to-code
      # path, so the injection protection above is unaffected. It is required:
      # public/alti.glb declares EXT_meshopt_compression, and the meshopt decoder
      # is WASM. Without the token Chrome blocks the compile, GLTFLoader throws
      # after the model downloads, and the 3D mascot silently degrades to its
      # static fallback icon. This surfaced the moment the CSP flipped from
      # Report-Only to enforcing -- report-only never blocked the compile.
      # media-src allows the altivum-media-assets CloudFront origin
      # (d1x8296f4gso9u.cloudfront.net) for the home-page hero intro video.
      # worker-src allows 'self' and blob: for Three.js/R3F GLTFLoader decode
      # workers (the alti.glb mascot uses meshopt compression).
      # img-src MUST allow blob:. alti.glb embeds its three baked textures
      # (baseColor / normal / metallicRoughness) as glTF bufferViews rather than
      # external files, and three.js GLTFLoader materialises each one by wrapping
      # the bytes in a Blob and loading URL.createObjectURL(blob) into an <img>
      # (GLTFLoader.js, loadTextureImage). blob: is same-origin and can only be
      # minted by script already executing on the page, so this grants no new
      # fetch reach -- but without it every texture is blocked, the material
      # falls back to its default white baseColor, and the mascot renders as an
      # untextured grey blob. Same Report-Only -> enforcing regression as the
      # 'wasm-unsafe-eval' note above: the geometry decodes, the model appears,
      # and only the colour is missing, so it reads as a design choice rather
      # than a failure. Confirmed in production via a securitypolicyviolation
      # event: {effectiveDirective: 'img-src', blockedURI: 'blob'}.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com https://plausible.io https://challenges.cloudflare.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://cdn.sanity.io https://i.ytimg.com; media-src 'self' https://d1x8296f4gso9u.cloudfront.net; connect-src 'self' https://cloudflareinsights.com https://plausible.io https://vrs4egsi745nep54y6abvwlcwq0smqak.lambda-url.us-east-2.on.aws https://sf5bejshafrb6t7zbbfw5knu7a0axlyp.lambda-url.us-east-2.on.aws https://mrrpf6f34n7vpkolurdc24c5fu0jruad.lambda-url.us-east-1.on.aws https://*.sanity.io https://*.apicdn.sanity.io https://zk46cokyuwgtdtz2ocdlhtjcji0fnidk.lambda-url.us-east-1.on.aws https://dnsio2ypcuxamxgzjpxr7knwpe0ybbuq.lambda-url.us-east-1.on.aws https://b6u7jlyktwv7wtseebhl45lv4y0byxnl.lambda-url.us-east-1.on.aws https://cognito-idp.us-east-1.amazonaws.com https://cognito-identity.us-east-1.amazonaws.com https://dataplane.rum.us-east-1.amazonaws.com https://challenges.cloudflare.com https://fx6pbx5hkhyrccf6c7pqk6x5fq0idpiv.lambda-url.us-east-1.on.aws https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src https://www.youtube.com https://open.spotify.com https://www.buzzsprout.com https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:; object-src 'none'; upgrade-insecure-requests; report-uri https://dnsio2ypcuxamxgzjpxr7knwpe0ybbuq.lambda-url.us-east-1.on.aws/csp-report"
  # --- Caching (also previously ignored in amplify.yml; restored here) ----------
  - pattern: '**/*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: 'assets/**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  # HTML: `no-cache, must-revalidate` (NOT `no-store`) preserves bfcache
  # eligibility (VAL-PERF-009). `no-store` disables back/forward cache in
  # Chromium because the page is treated as non-cacheable; `no-cache` still
  # revalidates with the origin on navigation but lets the browser keep a
  # stale copy for instant bfcache restore. Hashed assets below remain
  # immutable for a year.
  - pattern: '*.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: 'index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '**/*.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '**/*.jpg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '**/*.jpeg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '**/*.webp'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '**/*.glb'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: 'sitemap.xml'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
  - pattern: 'rss.xml'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
